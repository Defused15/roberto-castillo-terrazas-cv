name: CI

on:
  # Push only on main: commits on dev are validated by their PR, so each commit gets a single run.
  push:
    branches: [main]
    # Docs-only pushes to main skip CI. Not applied to pull_request on purpose: the required
    # "Unit Tests" check must always report on a PR, or a docs-only PR would wait forever.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  # Weekly full run (full Stryker, fresh dashboard and hub). GitHub disables scheduled
  # workflows after 60 days without repo activity; re-enable it from the Actions tab if so.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      full_mutation:
        description: 'Run a full (non-incremental) Stryker run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # PRs share one group per PR so superseded runs are cancelled. Every other event gets a
  # unique group (run_id): a shared group with cancel-in-progress: false keeps only one
  # pending run and would silently drop a middle push to main. Hub and Pages writes are
  # serialized by their own job-level concurrency groups instead.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Unit Tests # required status check in the "Protect main" ruleset - do not rename
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare report directories
        run: mkdir -p reports jest-report

      - name: Lint
        run: npm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      # Jest's own exit code is the gate: it is non-zero for failed tests, suites that fail
      # to load and runtime errors. The JSON report is still written on failure.
      - name: Jest (coverage + JSON report)
        if: ${{ !cancelled() }}
        run: npx jest --ci --coverage --json --outputFile=jest-report/report.json

      - name: Summarize Jest report
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "jest-report/report.json";
            if (!fs.existsSync(p)) {
              console.log("::error::jest-report/report.json is missing (Jest did not run or crashed)");
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            const line = `Tests: ${r.numPassedTests}/${r.numTotalTests} passed, ${r.numFailedTests} failed | ` +
              `Suites: ${r.numFailedTestSuites} failed, ${r.numRuntimeErrorTestSuites} runtime errors`;
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Jest\n\n${line}\n`);
            if (!r.success || r.numFailedTests > 0 || r.numFailedTestSuites > 0 || r.numRuntimeErrorTestSuites > 0) {
              process.exit(1);
            }
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Jest JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-report
          path: jest-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate Jest dashboard
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node generate-jest-dashboard.mjs --json ./jest-report/report.json --html ./reports/jest-dashboard.html

      - name: Upload Jest dashboard
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-dashboard
          path: reports/jest-dashboard.html
          retention-days: 1

  # The site is static: the years of experience and job durations are computed at build
  # time. A weekly rebuild keeps them current without a code push. Needs a Vercel deploy
  # hook for main in the VERCEL_DEPLOY_HOOK secret; without it the job only logs a notice.
  redeploy:
    name: Weekly Vercel Redeploy
    # After the hub publish, so the rebuild picks up this run's test report for the badge.
    needs: [test, hub]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger the Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set; skipping the weekly redeploy"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 --retry 2 -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Vercel redeploy of main requested"

  commitlint:
    name: Commit Lint # informative, not a required check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Full history so the PR's base..head range can be walked.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tailwind.config.js', 'postcss.config.js', 'tsconfig.json') }}
          restore-keys: |
            nextjs-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Lint is enforced by the required "Unit Tests" job, so it is not repeated here.
      # next build (Next 16 no longer lints) still type-checks and compiles every route.
      - name: Next.js build
        run: npx next build

  mutation:
    name: Mutation Testing # informative, not a required check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare report directory
        run: mkdir -p reports

      # Incremental mode detects changed source files but not changed tests or config, which can
      # reuse stale "no coverage" results. Scope the cache to a hash of the tests and the test/mutation
      # config: any change there misses the cache and forces a full run.
      - name: Compute Stryker cache scope
        id: stryker-scope
        run: echo "hash=${{ hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx', 'src/test/**', 'src/__tests__/**', 'stryker.config.json', 'jest.config.js', 'jest.setup.ts') }}" >> "$GITHUB_OUTPUT"

      # Unique key per run, restored by prefix within the same test scope: the newest state in reach wins.
      - name: Restore Stryker incremental state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-v2-${{ steps.stryker-scope.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-v2-${{ steps.stryker-scope.outputs.hash }}-

      # incremental is on in stryker.config.json. Incremental mode does not notice dependency
      # changes, so the weekly schedule (or a manual full_mutation run) re-tests every mutant.
      - name: Run Stryker mutation tests
        env:
          FULL_RUN: ${{ github.event_name == 'schedule' || inputs.full_mutation == true }}
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            npx stryker run --force
          else
            npx stryker run
          fi

      - name: Save Stryker incremental state
        if: ${{ !cancelled() && hashFiles('reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-v2-${{ steps.stryker-scope.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  hub:
    name: Publish to QA Hub
    needs: test
    # Only main pushes and the schedule: never PRs (fork PRs have no secrets, and PR runs
    # racing main caused 409s). Failed test runs are published too, so the hub shows them.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
      && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: qa-hub
      cancel-in-progress: false

    steps:
      - name: Checkout composite action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      # The test job may fail before Jest writes a report (e.g. install failure): then there
      # is no artifact and nothing to publish, which must not turn this job red.
      - name: Download Jest JSON report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jest-report
          path: jest-report/

      - name: Skip publish (no Jest report)
        if: hashFiles('jest-report/report.json') == ''
        run: echo "::notice::No Jest report was produced by Unit Tests; skipping hub publish"

      - name: Push report to QA Hub
        if: hashFiles('jest-report/report.json') != ''
        uses: ./.github/actions/jest-report-hub
        with:
          hub_token: ${{ secrets.HUB_TOKEN }}
          hub_repo: Defused15/test-hub
          project_name: roberto-castillo-terrazas-cv

  deploy-dashboard:
    name: Deploy Dashboard to GitHub Pages
    needs: [test, mutation]
    if: >-
      ${{ !cancelled() && needs.test.result == 'success'
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download Jest dashboard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jest-dashboard
          path: site/

      # Fresh report from this run's Stryker job (also produced when the break threshold fails)
      - name: Download mutation report
        if: needs.mutation.result == 'success' || needs.mutation.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-report
          path: site/mutation/

      - name: Add site index
        run: cp site/jest-dashboard.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
